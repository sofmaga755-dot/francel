<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celular Virtual AU Personalizado</title>
    <style>
        body {
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .celular {
            width: 360px;
            height: 740px;
            background-color: #000;
            border: 12px solid #333;
            border-radius: 40px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .barra-estado {
            height: 30px;
            background-color: rgba(0, 0, 0, 0.4);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            z-index: 20;
        }

        .pantalla { flex: 1; position: relative; }

        /* -----------------------------------------
           1. FONDO DE PANTALLA PRINCIPAL
        ----------------------------------------- */
        .home-screen {
            width: 100%;
            height: 100%;
            /* ⚠️ PEGA AQUÍ TU FONDO DE INICIO */
            background-image: url('CAMBIA_ESTO_POR_EL_LINK_DE_TU_FONDO_PRINCIPAL.jpg'); 
            background-size: cover;
            background-position: center;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: max-content;
            gap: 20px;
            padding: 40px 20px 20px 20px;
            box-sizing: border-box;
            position: absolute;
            z-index: 1;
        }

        /* Iconos */
        .app-container { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .app-label {
            color: white; font-size: 11px; margin-top: 5px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-weight: 500;
        }

        .icon-mensajes { background-color: #25D366; }
        .icon-llamadas { background-color: #007AFF; }

        /* Estructura de las Apps */
        .app-screen {
            width: 100%; height: 100%;
            position: absolute;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.7, 0.1, 1);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-sizing: border-box;
            padding-top: 30px;
        }
        .app-screen.activa { transform: translateY(0); }
        
        .app-header {
            padding: 15px; font-weight: bold; font-size: 18px;
            display: flex; align-items: center;
            border-bottom: 1px solid rgba(250,250,250,0.1);
        }
        .app-body { flex: 1; overflow-y: auto; padding: 15px; }

        /* -----------------------------------------
           2. FONDO DEL CHAT (WHATSAPP)
        ----------------------------------------- */
        #app-mensajes { 
            /* ⚠️ PEGA AQUÍ EL FONDO PARA EL CHAT */
            background-image: url('CAMBIA_ESTO_POR_EL_LINK_DEL_FONDO_DE_CHAT.jpg');
            background-size: cover;
            background-position: center;
            color: #e9edef; 
        }
        
        /* Cabecera del chat con la foto del personaje */
        .chat-header-user { display: flex; align-items: center; gap: 10px; }
        .chat-avatar-header {
            width: 35px; height: 35px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            /* ⚠️ FOTO DE TU PERSONAJE EN LA BARRA DE ARRIBA */
            background-image: url('CAMBIA_ESTO_POR_LA_FOTO_DE_TU_PERSONAJE.jpg');
        }

        .chat-body-container { display: flex; flex-direction: column; height: 100%; }
        .chat-bubble { max-width: 75%; padding: 8px 12px; border-radius: 12px; margin-bottom: 10px; font-size: 14px; }
        .bubble-recibido { background-color: #202c33; align-self: flex-start; margin-right: auto;}
        .bubble-enviado { background-color: #005c4b; align-self: flex-end; margin-left: auto; }

        /* -----------------------------------------
           3. PANTALLA DE LLAMADA
        ----------------------------------------- */
        #app-llamadas { background-color: #111; color: #fff; text-align: center; }
        .avatar-llamada { 
            width: 110px; height: 110px; 
            border-radius: 50%; 
            margin: 50px auto 20px auto; 
            background-size: cover;
            background-position: center;
            /* ⚠️ FOTO EN GRANDE DE TU PERSONAJE LLAMANDO */
            background-image: url('CAMBIA_ESTO_POR_LA_FOTO_DE_TU_PERSONAJE.jpg');
        }
        .nombre-llamada { font-size: 24px; font-weight: bold; }
        .estado-llamada { color: #4CD964; font-size: 14px; margin-top: 5px; animation: parpadeo 1.5s infinite; }
        @keyframes parpadeo { 50% { opacity: 0; } }
        .botones-llamada { display: flex; justify-content: center; margin-top: 80px; }
        .btn-colgar { width: 65px; height: 65px; background-color: #FF3B30; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; }

        .barra-navegacion { height: 40px; background-color: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 30; }
        .boton-home { width: 50px; height: 5px; background-color: #fff; border-radius: 10px; cursor: pointer; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="celular">
        <div class="barra-estado">
            <span id="hora">12:00</span>
            <span>📶 🔋 95%</span>
        </div>

        <div class="pantalla">
            <!-- PANTALLA PRINCIPAL -->
            <div class="home-screen">
                <div class="app-container" onclick="abrirApp('app-mensajes')">
                    <div class="app-icon icon-mensajes">💬</div>
                    <div class="app-label">Mensajes</div>
                </div>

                <div class="app-container" onclick="abrirApp('app-llamadas')">
                    <div class="app-icon icon-llamadas">📞</div>
                    <div class="app-label">Teléfono</div>
                </div>
            </div>

            <!-- APP MENSAJES -->
            <div class="app-screen" id="app-mensajes">
                <div class="app-header">
                    <div class="chat-header-user">
                        <div class="chat-avatar-header"></div>
                        <!-- CAMBIA AQUÍ EL NOMBRE DE TU PERSONAJE -->
                        <span>Nombre Personaje</span> 
                    </div>
                </div>
                <div class="app-body">
                    <div class="chat-body-container">
                        <!-- CAMBIA AQUÍ LOS CHATS -->
                        <div class="chat-bubble bubble-recibido">¿Hola? ¿Estás ahí?</div>
                        <div class="chat-bubble bubble-enviado">Sí, dime qué pasó.</div>
                        <div class="chat-bubble bubble-recibido">Tenemos un problema grave... lo de la apuesta se descubrió.</div>
                    </div>
                </div>
            </div>

            <!-- APP LLAMADAS -->
            <div class="app-screen" id="app-llamadas">
                <div class="app-body">
                    <div class="avatar-llamada"></div>
                    <!-- CAMBIA EL NOMBRE DE QUIEN LLAMA -->
                    <div class="nombre-llamada">Nombre Personaje</div>
                    <div class="estado-llamada">Llamando...</div>
                    <div class="botones-llamada">
                        <div class="btn-colgar" onclick="cerrarTodasLasApps()">❌</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="barra-navegacion">
            <div class="boton-home" onclick="cerrarTodasLasApps()"></div>
        </div>
    </div>

    <script>
        function actualizarHora() {
            const ahora = new Date();
            let horas = ahora.getHours();
            let minutos = ahora.getMinutes();
            minutos = minutos < 10 ? '0' + minutos : minutos;
            document.getElementById('hora').innerText = `${horas}:${minutos}`;
        }
        setInterval(actualizarHora, 1000);
        actualizarHora();

        function abrirApp(idApp) {
            cerrarTodasLasApps();
            document.getElementById(idApp).classList.add('activa');
        }

        function cerrarTodasLasApps() {
            const apps = document.querySelectorAll('.app-screen');
            apps.forEach(app => app.classList.remove('activa'));
        }
    </script>
</body>
</html>
